<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><title>Note pointers</title>
<link rel="stylesheet" href="fixture.css">
<style>
* { box-sizing:border-box; }
body { margin:0; background:#0f111a; color:#e8ebf0; font:20px/1.65 -apple-system,sans-serif; }
header { height:72px; padding:18px 40px; border-bottom:1px solid #252a39; background:#090c12; font-size:15px; }
header span { color:#aeb3c1; margin-left:25px; font-size:13px; }
#scroll { height:calc(100vh - 72px); overflow-y:auto; }
#editor { max-width:920px; padding:36px 70px 200px; margin:auto; }
.ProseMirror { outline:none; }
.right-route-proof .ProseMirror p { text-align:right; }
.ProseMirror p { margin:0 0 20px; }
.ProseMirror .toggle-block { position:relative; }
</style></head><body><header>Notes <span>⌘P · Connect a source to a target</span></header>
<main id="scroll"><div id="editor"></div></main><script src="fixture.js"></script></body></html>
