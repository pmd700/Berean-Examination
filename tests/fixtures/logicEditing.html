<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Disposable formula editing proof</title>
<link rel="stylesheet" href="./fixture.css">
<style>
body { background:#0f111a; color:#e8ebf0; padding:48px; font:21.333px/1.5 -apple-system,sans-serif; }

<div id="editor"></div>
